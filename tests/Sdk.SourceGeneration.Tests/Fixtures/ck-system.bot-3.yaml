- id: Fixup.Script
  valueType: String
- id: RepositoryDump.DownloadPath
  valueType: String
  description: Relative path of the download of the dump file on the bot service, {tenantId}/v1/jobs/download?id={jobId}.
- id: RepositoryDump.JobId
  valueType: String
  description: Id of the Hangfire job that produced the dump; system/v1/jobs and the download address it.
- id: SelectedAttributeId
  valueType: String
  description: The id of the attribute that is being configured.
records:
