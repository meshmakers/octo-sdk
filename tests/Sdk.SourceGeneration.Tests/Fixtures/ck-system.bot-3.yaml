types:
- isCollectionRoot: true
  typeId: AttributeAggregateConfiguration
  derivedFromCkTypeId: System@2/Entity-1
  associations:
  - id: System.Bot-3.7.0/Configures-1
    targetCkTypeId: System@2/Entity-1
  derivable: Any
  attributes:
  - id: System@2/Enabled-1
    name: IsAutoCompleteEnabled
  - id: System.Bot-3.7.0/AutoCompleteFilter-1
    name: AutoCompleteFilter
  - id: System.Bot-3.7.0/AutoCompleteLimit-1
    name: AutoCompleteLimit
- isCollectionRoot: true
  typeId: Fixup
  derivedFromCkTypeId: System@2/Entity-1
  derivable: Any
  attributes:
  - id: System@2/Enabled-1
    name: Enabled
  - id: System@2/Name-1
    name: Name
  - id: System.Bot-3.7.0/Fixup.Order-1
    name: Order
  - id: System.Bot-3.7.0/Fixup.Script-1
    name: Script
  - id: System.Bot-3.7.0/Fixup.IsApplied-1
    name: IsApplied
  - id: System.Bot-3.7.0/Fixup.AppliedAt-1
    name: AppliedAt
    isOptional: true
  - id: System.Bot-3.7.0/Fixup.Output-1
    name: Output
    isOptional: true
  - id: System.Bot-3.7.0/Fixup.Error-1
    name: Error
