$schema: https://schemas.meshmakers.cloud/construction-kit-elements.schema.json
types:
# AB#8423: one type per method shape the SDK method client generator must cover.
- typeId: Account
  derivedFromCkTypeId: ${System}/Entity
  description: "Type with an instance method, a second method version, a method without parameters and a static method."
  attributes:
    - id: ${System}/Name
      name: Name
      isOptional: true
  methods:
    - methodId: ResetPassword-1
      description: "Instance method with one required parameter, a String result and a declared error."
      parameters:
        - { name: newPassword, valueType: String, sensitive: true, description: "The new password." }
      result:
        valueType: String
      errors:
        - code: PASSWORD_POLICY_VIOLATION
          description: "The password does not meet the policy."
      authorization:
        roles: [ AccountAdmin ]
    - methodId: ResetPassword-2
      description: "Second version: required and optional parameters, an enum parameter, two declared errors, no result."
      parameters:
        - { name: newPassword, valueType: String, sensitive: true }
        - { name: notifyUser, valueType: Boolean, isOptional: true }
        - { name: state, valueType: Enum, valueCkEnumId: "${this}/AccountState", isOptional: true }
      errors:
        - code: PASSWORD_POLICY_VIOLATION
        - code: PASSWORD_REUSED
      authorization:
        roles: [ AccountAdmin ]
    - methodId: Touch-1
      description: "Instance method without parameters and without result."
      authorization:
        roles: [ AccountAdmin ]
    - methodId: FindByName-1
      kind: Static
      description: "Static method with a record result."
      parameters:
        - { name: name, valueType: String }
        - { name: maxResults, valueType: Int, isOptional: true }
      result:
        valueType: Record
        valueCkRecordId: "${this}/AccountSummary"
      authorization:
        roles: [ AccountAdmin ]
    - methodId: CountLocked-1
      kind: Static
      description: "Static method without parameters and an Int result."
      result:
        valueType: Int
      authorization:
        roles: [ AccountAdmin ]
- typeId: ServiceAccount
  derivedFromCkTypeId: ${this}/Account
  description: "Derived concrete type: inherits all methods of Account."
- typeId: Note
  derivedFromCkTypeId: ${System}/Entity
  description: "Type without methods: generates exactly the DTOs it generated before AB#8423."
  attributes:
    - id: ${System}/Name
      name: Name
      isOptional: true
