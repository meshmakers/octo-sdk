associationRoles:
- id: ExecutedPipeline
  inboundName: ExecutedPipeline
  outboundName: PipelineExecutions
  inboundMultiplicity: N
  outboundMultiplicity: One
  description: Links a pipeline execution record to the pipeline that was executed.
- id: Executes
  inboundName: Executes
  outboundName: ExecutedBy
  inboundMultiplicity: N
  outboundMultiplicity: One
  description: Links a pipeline to the adapter that executes it. Each pipeline is executed by exactly one adapter.
- id: ExecutingAdapter
  inboundName: ExecutingAdapter
  outboundName: AdapterExecutions
  inboundMultiplicity: N
  outboundMultiplicity: One
  description: Links a pipeline execution record to the adapter that performed the execution.
- id: HelmRepository
  inboundName: HelmRepositoryUsedBy
  outboundName: HelmRepository
  inboundMultiplicity: N
  outboundMultiplicity: ZeroOrOne
  description: Links a deployable workload (Adapter / Application) to the Helm chart repository it pulls its chart from. Separate from the generic Uses role so the inverse view on HelmRepositoryConfiguration does not collide with Pipeline.Uses — keeping HelmRepositoryConfiguration as a regular SystemConfigurationInterface implementer in the generated GraphQL schema.
- id: Hosts
  inboundName: Hosts
  outboundName: HostedBy
  inboundMultiplicity: N
  outboundMultiplicity: ZeroOrOne
  description: Links a deployment site to the workloads deployed there. A workload is hosted by at most one site. Renamed from Manages/ManagedBy in 4.0.0 together with the target type Pool -> DeploymentSite.
- id: LentFrom
  inboundName: LentTo
  outboundName: LentFrom
  inboundMultiplicity: N
  outboundMultiplicity: ZeroOrOne
  description: Links a borrowing adapter to the local mirror of the adapter pool it leases members from. An adapter borrows from at most one pool; one mirror serves every adapter in the tenant that borrows from that pool. Replaces the LentFromTenantId/LentFromAdapterPoolRtId attributes of 4.0.0.
- id: MapsFrom
  inboundName: MapsFrom
  outboundName: MappedAsSource
  inboundMultiplicity: N
  outboundMultiplicity: N
  description: Links a DataPointMapping to its source data point entity
- id: MapsTo
  inboundName: MapsTo
  outboundName: MappedAsTarget
  inboundMultiplicity: N
  outboundMultiplicity: N
  description: Links a DataPointMapping to its target domain entity
- id: MapsToEntity
  inboundName: MapsTo
  outboundName: MappedFrom
  inboundMultiplicity: N
  outboundMultiplicity: ZeroOrOne
  description: Links a data source entity to a target domain entity for value propagation
- id: PipelineServiceAccount
  inboundName: PipelineServiceAccountOf
  outboundName: PipelineServiceAccount
  inboundMultiplicity: N
  outboundMultiplicity: ZeroOrOne
  description: Links an Adapter to the ServiceAccountConfiguration whose client credentials its pipelines execute under (AB#5027). Acts as the adapter-wide default; a single pipeline may override it by linking its own ServiceAccountConfiguration through the generic Uses role. Separate from Uses so the inverse view on Configuration stays Pipeline-scoped and SystemConfigurationInterface survives in the generated GraphQL schema.
- id: PoolServiceAccount
  inboundName: PoolServiceAccountOf
  outboundName: PoolServiceAccount
  inboundMultiplicity: N
  outboundMultiplicity: ZeroOrOne
  description: Links an adapter pool to the service account its members authenticate with when they open the management connection to the pool hub. Not the identity work runs under — that comes from the borrower's own account, carried on each lease.
- id: SendsDataTo
  inboundName: SendsDataTo
  outboundName: ReceivesDataFrom
  inboundMultiplicity: N
  outboundMultiplicity: N
  description: Links a pipeline to downstream pipelines that receive its output data for chained processing.
- id: StatisticsForPipeline
  inboundName: StatisticsForPipeline
  outboundName: PipelineStatistics
  inboundMultiplicity: One
  outboundMultiplicity: ZeroOrOne
  description: Links a pipeline statistics record to the pipeline it aggregates metrics for. Each pipeline has at most one statistics record.
- id: Tag
  inboundName: TaggedBy
  outboundName: IsTagging
  inboundMultiplicity: N
  outboundMultiplicity: N
  description: Links a tag to the entities it labels for categorization and filtering.
- id: Triggers
  inboundName: Triggers
  outboundName: TriggeredBy
  inboundMultiplicity: ZeroOrOne
  outboundMultiplicity: N
  description: Links a pipeline trigger to the pipelines it starts on schedule.
- id: Uses
  inboundName: UsedBy
  outboundName: IsUsing
  inboundMultiplicity: N
  outboundMultiplicity: N
  description: Links a pipeline to the configurations it requires for execution (e.g. connection settings for external systems).
attributes:
- id: AdapterConfiguration
  valueType: String
  ownership: Secret
  isRuntimeState: true
  description: JSON-serialized adapter-specific configuration that is deployed to the adapter. Entered by the tenant and may hold credentials, so it is owned by the tenant - a blueprint update or re-apply keeps the stored value and only initialises a new adapter - and it is not carried in an ExportRt.
- id: AdapterSharingMode
  valueType: Enum
  valueCkEnumId: System.Communication-4.19.0/AdapterSharingMode-1
  defaultValues:
  - 0
  description: "Whether and to whom an adapter pool lends its members, i.e. which part of the tenant tree may be handed a lease on it (AB#4924). NotShared (default) makes the pool private to its owning tenant, which is a legitimate configuration — a pool is still useful as a way to run one tenant's own workloads elastically. The trust direction is fixed by the tenant tree and is never configurable upwards: a descendant can not lend to its ancestors (concept §3)."
- id: AdminPassword
  valueType: Secret
  ownership: Secret
  isRuntimeState: true
  description: Grafana Server Admin password.
- id: AdminUser
  valueType: String
  isRuntimeState: true
  description: Grafana Server Admin username for organization management API.
- id: AiModel
  valueType: String
  description: 'AI model identifier to use (e.g. claude-sonnet-4-6, claude-opus-4-1). Mandatory and has no default: a pinned model id goes out of date (a retired "-20250514" snapshot returns HTTP 404), so it must be set explicitly on each AiConfiguration.'
- id: AllowDelegation
  valueType: Boolean
  description: Whether the identity client carries the on-behalf-of delegation grant (urn:meshmakers:params:oauth:grant-type:on-behalf-of, AB#5026/AB#5031). Absent means true — the pre-AB#5111 behaviour, where every provisioned pipeline service account got the grant. Set to false to make the account strictly client_credentials.
- id: ApiKey
  valueType: Secret
  ownership: Secret
  isRuntimeState: true
  description: API key for authenticating with an external service (e.g. Anthropic sk-ant-... key, WeClapp API token). Stored as configuration attribute, not exposed in pipeline data context.
- id: ApiUrl
  valueType: String
  description: Base URL of the cluster-shared signal-cli-rest-api bridge this channel is registered against (e.g. http://signal-cli-rest-api.signal-bridge.svc.cluster.local:8080). The bridge API is unauthenticated; only the Communication Controller may call it.
- id: AppHeading
  valueType: String
  isRuntimeState: true
  description: Heading displayed in the application header bar
- id: AppTitle
  valueType: String
  isRuntimeState: true
  description: Browser tab title of the web application
- id: AssignedRoleNames
  valueType: StringArray
  description: "Declared roles of the identity client (AB#5111). When set, the reconcile syncs the client's AssignedRole edges to exactly this list — missing roles are added, superfluous ones removed. When absent, the account is in legacy (pre-declarative) mode: the reconcile leaves the client's roles completely untouched, so role edges granted by hand or by a blueprint survive. Setting this attribute is the explicit opt-in to declarative role management."
- id: AzureTenantId
  valueType: String
  isRuntimeState: true
  description: The Azure Active Directory tenant ID (GUID) for OAuth2 authentication.
- id: BackgroundColor
  valueType: String
  isRuntimeState: true
  description: Background color of the web application
- id: BankAccountHolder
  valueType: String
  isRuntimeState: true
  description: Account holder of the energy community's own account, as it must appear on a transfer
- id: BankAccountIban
  valueType: String
  isRuntimeState: true
  description: IBAN of the energy community's own account - the one members are asked to pay into. Distinct from Customer.BankAccount, which holds a MEMBER's account and is used for payouts in the opposite direction.
- id: BillingMailServerConfiguration
  valueType: String
  ownership: TenantOwned
  isRuntimeState: true
  description: Well-known name of the EMailSenderConfiguration used for outbound billing mail
- id: BillingReportFilePrefix
  valueType: String
  ownership: TenantOwned
  isRuntimeState: true
  description: Filename prefix for generated billing report files (e.g. Billing_)
- id: BillingReportName
  valueType: String
  ownership: TenantOwned
  isRuntimeState: true
  description: Name of the Telerik billing report template (e.g. Billing.trdp)
- id: BotToken
  valueType: Secret
  ownership: Secret
  isRuntimeState: true
  description: 'The bot token used as the `Authorization: Bot {token}` header when calling the Discord REST API.'
- id: CallerAccessToken
  valueType: String
  isRuntimeState: true
  description: "The invoker's bearer token for delegation, ENCRYPTED with the controller's instance key (enc:v1: sentinel) — never plaintext (AB#5279). Written only when the controller has an encryption key; read back and decrypted at lease grant, dropped there when expired. Unset when no token was carried or no key was configured."
- id: CallerEmail
  valueType: String
  isRuntimeState: true
  description: E-mail claim of the invoker of this queued work item (AB#5279).
- id: CallerName
  valueType: String
  isRuntimeState: true
  description: Display name (name / preferred_username) of the invoker of this queued work item (AB#5279).
- id: CallerRoles
  valueType: StringArray
  defaultValues: []
  isRuntimeState: true
  description: Role claims of the invoker of this queued work item (AB#5279).
- id: CallerSubjectId
  valueType: String
  isRuntimeState: true
  description: Subject (sub, or client_id for a client-credentials caller) of the invoker this queued work item was created for (AB#5279). Unset when the item was queued without an invoker — a cron tick or an internal caller.
- id: CallerTenantId
  valueType: String
  isRuntimeState: true
  description: Tenant claim of the invoker of this queued work item (AB#5279).
- id: CallerTrustLevel
  valueType: Int
  isRuntimeState: true
  description: 'Trust the invoker established (AB#5279): 2 = strongly authenticated (bearer on the execute route), 1 = weak, 0 = none. Mirrors CallerTrustLevel of the pipeline SDK.'
- id: Channel
  valueType: Enum
  valueCkEnumId: System.Communication-4.19.0/HelmChannel-1
  defaultValues:
  - 0
  description: Helm chart distribution channel (Dev or Release). Pure label for UI colour-coding; the operator does not derive behavior from it.
- id: ChartName
  valueType: String
  description: Helm chart name within the repository (e.g. voest-app, octo-mesh-adapter).
- id: ChartVersion
  valueType: String
  isRuntimeState: true
  description: 'Helm chart version (e.g. 1.2.3). Runtime-state (AB#4706): set by the CD pipeline (UpdateWorkloadChartVersion) or the operator, not blueprint configuration - a blueprint re-apply preserves the live value instead of resetting it to the seeded version.'
- id: ClientId
  valueType: String
  isRuntimeState: true
  description: 'OAuth2 Client ID for authenticating with the external API. Runtime state (AB#5187): issued to the tenant by the external provider, preserved across blueprint re-apply — a seed can only carry a placeholder.'
- id: ClientSecret
  valueType: Secret
  ownership: Secret
  isRuntimeState: true
  description: 'OAuth2 Client Secret for authenticating with the external API. Runtime state (AB#5027): issued/rotated at runtime, preserved across blueprint re-apply.'
- id: CommunicationState
  valueType: Enum
  valueCkEnumId: System.Communication-4.19.0/CommunicationState-1
  defaultValues:
  - 0
  isRuntimeState: true
  description: Current SignalR connection state of the adapter or pool operator.
- id: CommunicationStateTimestamp
  valueType: DateTime
  isRuntimeState: true
  description: Timestamp of the last communication state change (online/offline transition).
- id: CompletedAt
  valueType: DateTime
  isRuntimeState: true
  description: Timestamp when execution completed
- id: ConfigurationState
  valueType: Enum
  valueCkEnumId: System.Communication-4.19.0/ConfigurationState-1
  defaultValues:
  - 0
  isRuntimeState: true
  description: Current configuration deployment state of the adapter or pool.
- id: ConsecutiveStatusFailures
  valueType: Int
  isRuntimeState: true
  description: Number of failed status reports since the last successful one. Incremented on every error report, reset to 0 by a successful report. Empty until the first status report. Pipelines only for now (AB#5618).
- id: ConsumerPrice
  valueType: Double
  isRuntimeState: true
  description: Price per kWh for consumers in the energy community
- id: ConsumptionRecordRequestDelay
  valueType: Int
  defaultValues:
  - 5
  ownership: TenantOwned
  isRuntimeState: true
  description: Delay in days before automatic consumption record requests are sent
- id: CpuLimit
  valueType: String
  isRuntimeState: true
  description: Kubernetes CPU limit of the workload, e.g. "1" (AB#7426). Optional; absent means the chart default applies. Runtime state, see CpuRequest.
- id: CpuRequest
  valueType: String
  isRuntimeState: true
  description: 'Kubernetes CPU request of the workload, e.g. "250m" (AB#7426). Optional; absent means the chart default applies. Runtime state: set by operators on live tenants and preserved across blueprint re-apply.'
- id: CurrentValue
  valueType: String
  isRuntimeState: true
  description: Current value of the data point as a string (numeric conversion happens during mapping evaluation)
- id: DeploymentState
  valueType: Enum
  valueCkEnumId: System.Communication-4.19.0/DeploymentState-1
  defaultValues:
  - 0
  isRuntimeState: true
  description: Current deployment state of the entity (undeployed, pending, deployed, or error).
- id: DurationCount
  valueType: Int
  defaultValues:
  - 0
  isRuntimeState: true
  description: Number of folded executions that carried a duration
- id: DurationMs
  valueType: Int
  isRuntimeState: true
  description: Execution duration in milliseconds
- id: EmailFooterImage
  valueType: BinaryLinked
  isRuntimeState: true
  description: Image placed in the footer or imprint block of outgoing e-mails. Separate from FooterLogo, which brands the web application - the two are set independently on purpose.
- id: EnergyCommunityId
  valueType: String
  isRuntimeState: true
  description: ID of the energy community
- id: Environment
  valueType: Enum
  valueCkEnumId: System.Communication-4.19.0/Environment-1
  defaultValues:
  - 0
  description: Where the pool's adapter workloads are hosted. Edge (default) means an external operator installs and runs the pool; Cloud means the central Communication Operator auto-deploys it into the OctoMesh cluster.
- id: ErrorMessage
  valueType: String
  isRuntimeState: true
  description: Error message if execution failed
- id: ExecutionId
  valueType: String
  isRuntimeState: true
  description: Unique identifier (GUID) for this execution
- id: ExecutionStatus
  valueType: Enum
  valueCkEnumId: System.Communication-4.19.0/PipelineExecutionStatus-1
  defaultValues:
  - 0
  isRuntimeState: true
  description: Current status of the pipeline execution (Running, Completed, Failed, Interrupted, Cancelled).
- id: ExternalId
  valueType: String
  ownership: SeedOwned
  description: External identifier of the data point (e.g. Loxone State UUID, MQTT Topic, OPC-UA NodeId, Modbus Register)
- id: FailureCount
  valueType: Int
  defaultValues:
  - 0
  isRuntimeState: true
  description: Failed executions folded into this bucket
- id: FailureKind
  valueType: Enum
  valueCkEnumId: System.Communication-4.19.0/PipelineExecutionFailureKind-1
  isRuntimeState: true
  description: 'What a failed execution says about its writes (AB#8037): Failed (ordinary failure) or OutcomeUnknown (a write was not acknowledged and may have taken effect; a pipeline method answers METHOD_OUTCOME_UNKNOWN). Unset unless the execution failed and the adapter reported a kind.'
- id: FarmerTaxRate
  valueType: Double
  defaultValues:
  - 13.0
  isRuntimeState: true
  description: Tax rate applied to farmers in the energy community
- id: Favicon
  valueType: BinaryLinked
  isRuntimeState: true
  description: Favicon icon for the web application
- id: FoldedBefore
  valueType: DateTime
  isRuntimeState: true
  description: Hour-aligned fold boundary (AB#5583). HourlyBuckets before this instant are folded history (their executions were deleted); buckets at or after it are a snapshot of the still-retained executions. Unset on statistics written before AB#5583.
- id: Folder
  valueType: String
  isRuntimeState: true
  description: The mailbox folder to monitor for incoming emails (e.g. INBOX).
- id: FooterGradientEnd
  valueType: String
  isRuntimeState: true
  description: End color of the footer gradient
- id: FooterGradientStart
  valueType: String
  isRuntimeState: true
  description: Start color of the footer gradient
- id: FooterLogo
  valueType: BinaryLinked
  isRuntimeState: true
  description: Icon for the app footer
- id: GrafanaUrl
  valueType: String
  isRuntimeState: true
  description: Base URL of the Grafana instance.
- id: GuildId
  valueType: String
  isRuntimeState: true
  description: The Discord guild (server) snowflake ID. Reserved for future channel-name resolution; not read by the ToDiscord node in v1.
- id: HeaderGradientEnd
  valueType: String
  isRuntimeState: true
  description: End color of the header gradient
- id: HeaderGradientStart
  valueType: String
  isRuntimeState: true
  description: Start color of the header gradient
- id: HeaderLogo
  valueType: BinaryLinked
  isRuntimeState: true
  description: Icon for the app header
- id: HelmRepositoryPurpose
  valueType: Enum
  valueCkEnumId: System.Communication-4.19.0/HelmRepositoryPurpose-1
  description: "What this repository serves — Adapters (adapter and platform charts) or Applications (tenant-app charts). AB#5295: unlike Channel this DOES drive behaviour: a DeployableWorkload with no HelmRepository association is resolved to the tenant's single repository whose purpose matches the workload type (Adapter/AdapterPool -> Adapters, Application -> Applications). Optional and without a default on purpose — a repository that does not declare its purpose is never chosen by that fallback, so tenants seeded before this attribute keep their exact previous behaviour until the channel blueprint stamps it."
- id: Host
  valueType: String
  isRuntimeState: true
  description: The host name is the name of the server on which the external system is running.
- id: Hostname
  valueType: String
  isRuntimeState: true
  description: 'Public hostname used when IngressEnabled=true (e.g. adapter.staging.octo-mesh.com). Adapters get a tenant-scoped path automatically (https://<hostname>/<tenantId>); Applications use the root path. Ignored when IngressEnabled=false. Runtime-state (AB#4706): the productive hostname is tenant-specific (e.g. <tenant>.meshmakers.cloud) and operator-managed - a blueprint re-apply preserves it instead of resetting to the seeded default and silently breaking the deployed ingress/DNS.'
- id: HourStartAt
  valueType: DateTime
  isRuntimeState: true
  description: Start of the hour this bucket covers (UTC, minute/second zeroed)
- id: HourlyBuckets
  valueType: RecordArray
  valueCkRecordId: System.Communication-4.19.0/PipelineStatisticsHourBucket-1
  isRuntimeState: true
  description: Per-hour execution buckets (UTC clock hours, rolling 30 days) holding every counted execution of the hour — folded and still-retained alike. Hours before FoldedBefore are folded history; hours at or after it are recomputed from the retained executions on every statistics sweep. The 12h/24h/30d counters are exactly the sum of these buckets over the window (AB#5583).
- id: IdentityServerUrl
  valueType: String
  description: URL of the OctoMesh Identity Server for provisioned datasource OAuth configuration.
- id: IdleTimeoutMinutes
  valueType: Int
  defaultValues:
  - 30
  isRuntimeState: true
  description: Minutes without pipeline activity before an OnDemand workload is drained and scaled to 0 replicas (AB#4914). Ignored for AlwaysOn workloads. Runtime-state (AB#5301), preserved across blueprint re-apply like LifecycleMode.
- id: IngressEnabled
  valueType: Boolean
  defaultValues:
  - false
  isRuntimeState: true
  description: 'When true, the operator projects ingress.enabled=true plus the workload Hostname into the Helm values. Cluster-wide defaults (className, cluster-issuer, TLS) come from the operator config and are not overridable per workload. Runtime-state (AB#4706): per-tenant operator decision, preserved across blueprint re-apply.'
- id: InputData
  valueType: String
  isRuntimeState: true
  description: Optional input data (JSON) for debugging
- id: IsDebuggingEnabled
  valueType: Boolean
  isRuntimeState: true
  description: Whether debugging is enabled for this pipeline
- id: IsSandbox
  valueType: Boolean
  isRuntimeState: true
  description: "If true, the adapter connects to the sandbox environment instead of production. Runtime state (AB#5187): part of the tenant's finAPI connection tuple, preserved with it."
- id: IsSecret
  valueType: Boolean
  defaultValues:
  - false
  isRuntimeState: true
  description: 'When true, the entry is a secret: its value is stored in SecretValue (a Secret attribute, encrypted by the engine) and rendered as a Kubernetes Secret reference at deploy time. Value is not encrypted; a legacy enc:v1 Value is still honoured but deprecated (AB#5537).'
- id: IsSslEnabled
  valueType: Boolean
  isRuntimeState: true
  description: The Secure Sockets Layer (SSL) protocol is used to secure communication between a client and a server.
- id: IssuerUri
  valueType: String
  description: URI of the OAuth2/OpenID Connect authorization server (e.g. https://identity.example.com)
- id: Last12HoursAvgDurationMs
  valueType: Int
  defaultValues:
  - 0
  isRuntimeState: true
  description: Average execution duration in the last 12 UTC clock hours including the current partial hour (ms)
- id: Last12HoursFailureCount
  valueType: Int
  defaultValues:
  - 0
  isRuntimeState: true
  description: Failed executions in the last 12 UTC clock hours including the current partial hour (= sum of the HourlyBuckets in that window; Completed = success, Failed = failure)
- id: Last12HoursSuccessCount
  valueType: Int
  defaultValues:
  - 0
  isRuntimeState: true
  description: Successful executions in the last 12 UTC clock hours including the current partial hour (= sum of the HourlyBuckets in that window; Completed = success, Failed = failure)
- id: Last24HoursAvgDurationMs
  valueType: Int
  defaultValues:
  - 0
  isRuntimeState: true
  description: Average execution duration in the last 24 UTC clock hours including the current partial hour (ms)
- id: Last24HoursFailureCount
  valueType: Int
  defaultValues:
  - 0
  isRuntimeState: true
  description: Failed executions in the last 24 UTC clock hours including the current partial hour (= sum of the HourlyBuckets in that window; Completed = success, Failed = failure)
- id: Last24HoursSuccessCount
  valueType: Int
  defaultValues:
  - 0
  isRuntimeState: true
  description: Successful executions in the last 24 UTC clock hours including the current partial hour (= sum of the HourlyBuckets in that window; Completed = success, Failed = failure)
- id: Last30DaysAvgDurationMs
  valueType: Int
  defaultValues:
  - 0
  isRuntimeState: true
  description: Average execution duration in the last 720 UTC clock hours (30 days) including the current partial hour (ms)
- id: Last30DaysFailureCount
  valueType: Int
  defaultValues:
  - 0
  isRuntimeState: true
  description: Failed executions in the last 720 UTC clock hours (30 days) including the current partial hour (= sum of the HourlyBuckets in that window; Completed = success, Failed = failure)
- id: Last30DaysSuccessCount
  valueType: Int
  defaultValues:
  - 0
  isRuntimeState: true
  description: Successful executions in the last 720 UTC clock hours (30 days) including the current partial hour (= sum of the HourlyBuckets in that window; Completed = success, Failed = failure)
- id: LastActivityAt
  valueType: DateTime
  isRuntimeState: true
  description: 'Timestamp of the last observed demand on the workload (pipeline execution, config push, or explicit wake; AB#4914). Input to the idle watchdog. Runtime-state: preserved across blueprint re-apply.'
- id: LastConfigurationError
  valueType: String
  isRuntimeState: true
  description: Last configuration error message. Set when ConfigurationState transitions to Error, cleared automatically when ConfigurationState transitions to Configured. Other state transitions (Pending, Unconfigured) leave this field untouched. Tracked separately from LastDeploymentError because configuration and deployment errors have independent root causes and must not mask each other.
- id: LastConfigurationErrorTimestamp
  valueType: DateTime
  isRuntimeState: true
  description: Timestamp of the LastConfigurationError. Set when LastConfigurationError is set, cleared when LastConfigurationError is cleared.
- id: LastDeploymentError
  valueType: String
  isRuntimeState: true
  description: Last deployment error message. Set when DeploymentState transitions to Error, cleared automatically when DeploymentState transitions to Deployed. Other state transitions (Pending, Undeployed) leave this field untouched so the user can see the most recent deployment failure cause until a successful deploy resolves it.
- id: LastDeploymentErrorTimestamp
  valueType: DateTime
  isRuntimeState: true
  description: Timestamp of the LastDeploymentError. Set when LastDeploymentError is set, cleared when LastDeploymentError is cleared.
- id: LastDeploymentWarning
  valueType: String
  isRuntimeState: true
  description: Last non-fatal warning of a deployment (AB#7426), e.g. that an explicit Helm value overrides one of the typed resource settings. Written by the Communication Controller, never by an author; cleared when a deployment produces no warning. Unlike LastDeploymentError the deployment still happened.
- id: LastError
  valueType: String
  isRuntimeState: true
  description: Last error reported by the Signal bridge for a register or verify attempt. Cleared on the next successful transition.
- id: LastExecutionAt
  valueType: DateTime
  isRuntimeState: true
  description: Timestamp of the most recent execution
- id: LastHourAvgDurationMs
  valueType: Int
  defaultValues:
  - 0
  isRuntimeState: true
  description: Average execution duration in the rolling last 60 minutes (ms)
- id: LastHourFailureCount
  valueType: Int
  defaultValues:
  - 0
  isRuntimeState: true
  description: Failed executions in the rolling last 60 minutes (Completed = success, Failed = failure)
- id: LastHourSuccessCount
  valueType: Int
  defaultValues:
  - 0
  isRuntimeState: true
  description: Successful executions in the rolling last 60 minutes (Completed = success, Failed = failure)
- id: LastSuccessfulStatusAt
  valueType: DateTime
  isRuntimeState: true
  description: UTC time of the last status report that was a success (e.g. a mail poll that completed). Unlike StatusMessage it is NOT overwritten by an error report, so "last succeeded at" survives a failing streak. Empty until the first successful status report. Written by the controller's status reporting (AB#5618), which today covers pipelines only; a report counts as a success unless it is flagged as an error or its line starts with "ERROR ".
- id: LastSyncedSequenceNumber
  valueType: Int
  defaultValues:
  - 0
  isRuntimeState: true
  description: Last synced sequence number for offline sync
- id: LastUpdate
  valueType: DateTime
  isRuntimeState: true
  description: Timestamp of the last value update for this data point
- id: LastUpdatedAt
  valueType: DateTime
  isRuntimeState: true
  description: When statistics were last calculated
- id: LeaseGrantedAt
  valueType: DateTime
  isRuntimeState: true
  description: Timestamp when a pool member was assigned this execution's tenant (AB#4924) — "when did it actually start" as opposed to "when did it stop waiting to be scheduled". Concept §8 Q5. Written on the Queued -> Running transition together with LeaseWaitMs. Unset on a dedicated adapter.
- id: LeaseReleasedAt
  valueType: DateTime
  isRuntimeState: true
  description: "Timestamp when the pool member was handed back after this execution (AB#4924) — \"how long did it hold the process\". LeaseGrantedAt..LeaseReleasedAt is the span a member was held for one tenant, and concept §4b makes that span, multiplied by the pool's per-member sizing, the exact consumption attributed to the borrowing tenant. It is therefore a BILLING input, not only a diagnostic: it must be stamped on the release path including the TTL-expiry and crash paths, where FinishedAt may never arrive. Unset on a dedicated adapter."
- id: LeaseWaitMs
  valueType: Int
  isRuntimeState: true
  description: Milliseconds the work item spent waiting for a lease (AB#4924), i.e. LeaseGrantedAt - QueuedAt, written once when the lease is granted. Stored rather than derived so it survives the AB#4370 execution fold, which erases the raw execution and keeps only the statistics — without it the queue latency of a leased pool would be unmeasurable a few hours after the fact. Unset on a dedicated adapter.
- id: LeasedFromAdapterPoolRtId
  valueType: String
  isRuntimeState: true
  description: RtId of the AdapterPool inside LeasedFromTenantId that served this execution (AB#4924). Bare 24-character hexadecimal RtId. Recorded per execution rather than read back from the adapter's LentFromPoolRtId because the borrowing adapter can be re-pointed at a different pool later, and a cost report over past executions must reflect where the work actually ran.
- id: LeasedFromTenantId
  valueType: String
  isRuntimeState: true
  description: "The lending tenant whose adapter pool served this execution (AB#4924). Written when the lease is granted. Together with LeasedFromPoolRtId it is what makes concept §4b's attribution exact: consumption is billed to the tenant whose work ran — this execution's own tenant — and the pool named here is where the per-member sizing that prices it comes from. Unset on a dedicated (AlwaysOn / OnDemand) adapter, which never leases."
- id: LeasedOnMemberId
  valueType: String
  isRuntimeState: true
  description: "Identity of the individual pool member (the process) that held the lease for this execution (AB#4924). This is what concept §5 calls \"an association from the execution to the assigned member\" — it can NOT be an association, because the member belongs to the lending tenant's database and this execution to the borrower's (see the file header). It is also not an RtId: members are replicas of one pool workload, not separate entities, so the value is the member's stable runtime identity (its pool-hub registration id). It exists so the per-adapter queue view — \"what is this member holding, what waits behind it\" — can be projected out of the pool queue."
- id: Lender
  valueType: Record
  valueCkRecordId: System.Communication-4.19.0/LenderReference-1
  isRuntimeState: true
  description: 'The lending tenant and pool this mirror stands for (AB#5271). Single-valued: a mirror has exactly one lender. Set and cleared as one unit, so a tenant id can never be present without its pool RtId.'
- id: LenderAdapterPoolRtId
  valueType: String
  isRuntimeState: true
  description: 'Member of the LenderReference record (AB#5271): the bare 24-character hexadecimal RtId of the AdapterPool inside LenderTenantId. Names the POOL, never an individual member — membership is elastic, so a reference to a member would dangle the moment that member is drained.'
- id: LenderTenantId
  valueType: String
  isRuntimeState: true
  description: 'Member of the LenderReference record (AB#5271): the tenant that owns the lent AdapterPool. Mirrored from the lending side; never author-set. The controller re-resolves it on every lease, so a stale value produces a refused deploy with a named reason rather than a wrong grant.'
- id: LendingAllowedTenantIds
  valueType: StringArray
  description: Optional allow-list narrowing the tenants an adapter pool with AdapterSharingMode != NotShared lends to (AB#4924). Absent or empty means "every tenant the sharing mode resolves to". A listed tenant that the sharing mode does NOT resolve to is ignored, never granted — the allow-list is an INTERSECTION with the tenant subtree, never a way around it, so the lending scope can not be widened past the trust boundary the tenant tree establishes.
- id: LendingMaxConcurrentLeasesPerTenant
  valueType: Int
  description: "Optional upper bound on how many of this pool's leases a single borrowing tenant may hold at the same time (AB#4924). Unset means no per-tenant cap — MaxReplicas and the round-robin rotation are the real bounds, which is why concept §8 Q11 deliberately left it without a default rather than inventing a number. Set it where one borrower is known to produce bursts (concept §6, \"A borrowed tenant floods the queue\"). It caps CONCURRENCY, not queue depth: excess work items stay Queued and visible in all three surfaces instead of being rejected."
- id: LentAdapterPoolDeploymentState
  valueType: Enum
  valueCkEnumId: System.Communication-4.19.0/DeploymentState-1
  isRuntimeState: true
  description: Deployment state of the lending pool as last mirrored (AB#5271). A pool that is not Deployed cannot serve a lease, so this is the one mirrored field that explains a queue that never drains. Mirrored rather than resolved on read because the borrower cannot query the lender's database.
- id: LentAdapterPoolMaxReplicas
  valueType: Int
  isRuntimeState: true
  description: Upper bound of the lending pool's replica range as last mirrored (AB#5271). Informational, as above.
- id: LentAdapterPoolMinReplicas
  valueType: Int
  isRuntimeState: true
  description: "Lower bound of the lending pool's replica range as last mirrored (AB#5271). Informational: it tells a borrower how much capacity is kept warm, which is what decides whether a lease is likely to be immediate or queued."
- id: LentAdapterPoolSharingMode
  valueType: Enum
  valueCkEnumId: System.Communication-4.19.0/AdapterSharingMode-1
  isRuntimeState: true
  description: "The lending pool's sharing mode as last mirrored (AB#5271). Shown so a borrower can see WHY a pool is available to it. \U0001F534 Display only: the lease-time decision always re-reads the lender's own pool and calls MayLendAsync, so a borrower editing this value in its own database changes what it sees, never what it may use."
- id: LifecycleMode
  valueType: Enum
  valueCkEnumId: System.Communication-4.19.0/LifecycleMode-1
  defaultValues:
  - 0
  isRuntimeState: true
  description: 'Lifecycle policy of the workload (AB#4914). AlwaysOn (default) keeps it running permanently; OnDemand allows the controller to scale it to 0 replicas when idle and wake it on demand; Leased borrows a process from an adapter pool per work item (AB#4924). Runtime-state (AB#5301): an operator decision about the deployed workload, preserved across blueprint re-apply — a blueprint may seed it, but a re-apply never resets it.'
- id: LifecycleState
  valueType: Enum
  valueCkEnumId: System.Communication-4.19.0/LifecycleState-1
  defaultValues:
  - 0
  isRuntimeState: true
  description: 'Runtime lifecycle state of the workload (AB#4914): Running, Draining, Hibernated, or Waking. Written exclusively by the Communication Controller (idle watchdog and wake gates). Runtime-state: preserved across blueprint re-apply — resetting a Hibernated workload to Running would break the offline-is-expected semantics.'
- id: MappingExpression
  valueType: String
  description: Optional mXparser expression to transform the source value. Variable value contains the source value.
- id: MappingTargets
  valueType: RecordArray
  valueCkRecordId: System.Communication-4.19.0/MappingTarget-1
  isRuntimeState: true
  description: Resolved mapping targets for data acquisition. Populated automatically by the BuildMappingTargets pipeline node from DataPointMappings.
- id: MaxConcurrentConnections
  valueType: Int
  description: The maximum number of concurrent connections is the maximum number of connections that can be established with an external system at the same time.
- id: MaxReplicas
  valueType: Int
  defaultValues:
  - 3
  description: 'Hard ceiling on adapter pool members (AB#4924). The pool never starts a member beyond this count no matter what the queue does — a pool that could grow without bound would reintroduce, as a cluster-capacity incident, exactly the per-tenant process sprawl this feature exists to remove. When the ceiling is reached the queue simply grows and stays visible in all three surfaces (concept §6, "Pool exhausted"): scale the pool, or move the tenant to a dedicated adapter.'
- id: MaxTokens
  valueType: Int
  defaultValues:
  - 4000
  description: Maximum number of tokens for the AI response.
- id: McpServerUrl
  valueType: String
  isRuntimeState: true
  description: URL of the OctoMesh MCP server for AI tool use (e.g. https://localhost:5017). The tenant ID is appended automatically.
- id: MemoryLimit
  valueType: String
  isRuntimeState: true
  description: Kubernetes memory limit of the workload, e.g. "1Gi" (AB#7426). Optional; absent means the chart default applies. Runtime state, see CpuRequest.
- id: MemoryRequest
  valueType: String
  isRuntimeState: true
  description: Kubernetes memory request of the workload, e.g. "512Mi" (AB#7426). Optional; absent means the chart default applies. Runtime state, see CpuRequest.
- id: MethodResultAdaptersRelinked
  valueType: Int
  isRuntimeState: true
  description: 'Method result member: number of leased adapters whose LentFrom edge was restored.'
- id: MethodResultAppliedToRunningAdapter
  valueType: Boolean
  isRuntimeState: true
  description: 'Method result member: true when the change was pushed to the running adapter; false when the adapter is offline and the change applies on the next deploy.'
- id: MethodResultClientId
  valueType: String
  isRuntimeState: true
  description: 'Method result member: the client id of the identity client of the pipeline service account. Never a secret.'
- id: MethodResultConfigurationWellKnownName
  valueType: String
  isRuntimeState: true
  description: 'Method result member: the well-known name of the ServiceAccountConfiguration the operation converged or rotated.'
- id: MethodResultDebuggingEnabled
  valueType: Boolean
  isRuntimeState: true
  description: 'Method result member: the debug state of the pipeline after the call.'
- id: MethodResultExecutionId
  valueType: String
  isRuntimeState: true
  description: 'Method result member: the id of the pipeline execution that was started; poll the PipelineExecution entities or the execution REST endpoints with it.'
- id: MethodResultGranted
  valueType: Boolean
  isRuntimeState: true
  description: 'Method result member: true when a lease was granted. A refused lease (no idle member, not lent to the borrower) is a normal answer with false and a status message, as in REST.'
- id: MethodResultIsNoOp
  valueType: Boolean
  isRuntimeState: true
  description: 'Method result member: true when the run changed nothing.'
- id: MethodResultLeaseId
  valueType: String
  isRuntimeState: true
  description: 'Method result member: the id of the granted lease.'
- id: MethodResultLendersUnreadable
  valueType: Int
  isRuntimeState: true
  description: 'Method result member: number of lending tenants whose pools could not be read; their mirrors were left as they were.'
- id: MethodResultMemberId
  valueType: String
  isRuntimeState: true
  description: 'Method result member: the pool member the lease was granted on.'
- id: MethodResultMessage
  valueType: String
  isRuntimeState: true
  description: 'Method result member: a human-readable summary of what the operation did. Never contains a secret.'
- id: MethodResultMirrorsCreatedOrUpdated
  valueType: Int
  isRuntimeState: true
  description: 'Method result member: number of LentAdapterPool mirrors that are present after the run (created or updated).'
- id: MethodResultMirrorsRemoved
  valueType: Int
  isRuntimeState: true
  description: 'Method result member: number of LentAdapterPool mirrors removed because the pool no longer lends to the tenant.'
- id: MethodResultNewAdapterRtId
  valueType: String
  isRuntimeState: true
  description: 'Method result member: the RtId of the adapter the pipeline is assigned to after the move.'
- id: MethodResultOldAdapterRtId
  valueType: String
  isRuntimeState: true
  description: 'Method result member: the RtId of the adapter the pipeline was assigned to before the move.'
- id: MethodResultOutcome
  valueType: String
  isRuntimeState: true
  description: 'Method result member: the outcome of a service account reconcile (AlreadyProvisioned, Provisioned or Repaired), as the REST reconcile answers it.'
- id: MethodResultReplicas
  valueType: Int
  isRuntimeState: true
  description: 'Method result member: the member count an adapter pool scale actually requested from the operator (the request clamped to MinReplicas..MaxReplicas).'
- id: MethodResultRequiresPipelineRedeploy
  valueType: Boolean
  isRuntimeState: true
  description: 'Method result member: true when the pipelines and data flows of the adapter must be redeployed before the rotated secret takes effect.'
- id: MethodResultRoleChangesSkipped
  valueType: Boolean
  isRuntimeState: true
  description: 'Method result member: true when the declared roles were not materialised because the caller lacks the UserManagement role (the client itself was converged).'
- id: MethodResultStartedAt
  valueType: DateTime
  isRuntimeState: true
  description: 'Method result member: when the pipeline execution was started (UTC).'
- id: MethodResultStatusMessage
  valueType: String
  isRuntimeState: true
  description: 'Method result member: why a lease was not granted, or a short confirmation.'
- id: MethodResultTenantsReconciled
  valueType: Int
  isRuntimeState: true
  description: 'Method result member: number of borrowing tenants whose LentAdapterPool mirrors were reconciled.'
- id: MethodResultWarning
  valueType: String
  isRuntimeState: true
  description: 'Method result member: a warning about a step after the main operation, e.g. the move is committed but the redeploy on the new adapter failed. Absent when everything succeeded.'
- id: MethodResultWasCreated
  valueType: Boolean
  isRuntimeState: true
  description: 'Method result member: true when the adapter had no pipeline service account and one was provisioned instead of rotated.'
- id: MinReplicas
  valueType: Int
  defaultValues:
  - 1
  description: 'Lower bound on adapter pool members (AB#4924). The default of 1 is the point of the pool: one member stays hot, so the FIRST work item of the day does not pay a cold start — which is exactly the cost that makes plain OnDemand unattractive for periodic work (adapter boot 13 s, or 4.2 s with the AB#4920 warm-up). 0 is permitted and turns the pool into a scale-to-zero pool where every burst pays one cold start; choose it only where work is genuinely rare.'
- id: Name
  valueType: String
  description: Optional display name for the tag.
- id: NetworkPartnerId
  valueType: String
  isRuntimeState: true
  description: ID of the network partner (Marktpartner
- id: NeutralColor
  valueType: String
  isRuntimeState: true
  description: The neutral color of the theme
- id: NotificationEmailContact
  valueType: String
  isRuntimeState: true
  description: Email address for notifications related to EDA processes and messages
- id: OAuthClientId
  valueType: String
  isRuntimeState: true
  description: OAuth client ID for the Grafana datasource plugin.
- id: OctoMeshUrl
  valueType: String
  description: URL of the OctoMesh Asset Repository for provisioned datasource configuration.
- id: OnDemandBlockingReasons
  valueType: String
  isRuntimeState: true
  description: 'Human-readable reasons why the workload is not OnDemandCapable (AB#4984), e.g. "pipeline X uses process-bound trigger FromPolling@1". Empty when OnDemandCapable=true. Computed by the Communication Controller; shown in the Studio next to the LifecycleMode setting. Runtime-state: preserved across blueprint re-apply.'
- id: OnDemandCapable
  valueType: Boolean
  defaultValues:
  - false
  isRuntimeState: true
  description: 'Whether the workload can safely run with LifecycleMode=OnDemand (AB#4984): true iff none of its deployed pipelines uses a process-bound trigger (e.g. FromPolling, FromWatchRtEntity) that would silently stop at 0 replicas. Computed by the Communication Controller from the registered node descriptors on adapter registration and pipeline deploy. Runtime-state: written exclusively by the controller, preserved across blueprint re-apply.'
- id: OutputData
  valueType: String
  isRuntimeState: true
  description: Optional output data (JSON) from pipeline execution result
- id: Password
  valueType: Secret
  ownership: Secret
  isRuntimeState: true
  description: The password is the secret that is used to authenticate with the external system.
- id: Path
  valueType: String
  isRuntimeState: true
  description: Dotted Helm values path for a ValueOverride entry (e.g. image.tag, service.port, oauth.clientId).
- id: PhoneNumber
  valueType: String
  description: 'Phone number in E.164 format (+ followed by digits, e.g. +436641234567). Unique per OctoMesh instance: exactly one tenant may claim a number.'
- id: PipelineDefinition
  valueType: String
  defaultValues:
  - ''
  description: JSON-serialized pipeline node graph that defines the data processing logic.
- id: PipelineExecutionClass
  valueType: Enum
  valueCkEnumId: System.Communication-4.19.0/PipelineExecutionClass-1
  defaultValues:
  - 1
  isRuntimeState: true
  description: "Scheduling class of this pipeline on a leased adapter pool (AB#4924), derived from its trigger node on save. Interactive is work a human is waiting for, Batch is everything scheduled or event-driven; within one tenant's turn in the round-robin rotation Interactive is served first, and across tenants the class has no effect at all. Default Batch: a pipeline whose trigger declares no class must never jump a queue. Computed and persisted rather than author-set, exactly like OnDemandCapable — the trigger-node descriptor contract carries the class the way it already carries RequiresRunningProcess (AB#4914 §5), so the reflection-based descriptor scan picks it up and future or third-party nodes self-describe without a controller-side list. Meaningful only for pipelines deployed to a Leased adapter; harmless and ignored everywhere else."
- id: PollIntervalSeconds
  valueType: Int
  defaultValues:
  - 30
  description: Interval in seconds between polling cycles.
- id: PoolMemberCpuLimit
  valueType: String
  description: Kubernetes CPU limit of each pool member, e.g. "1" (AB#4924). See PoolMemberCpuRequest for why this is one value per pool and why it is a string.
- id: PoolMemberCpuRequest
  valueType: String
  description: 'Kubernetes CPU request of EACH pool member, e.g. "200m" (AB#4924). One sizing per pool, applied identically to every member it starts (concept §8, Q15) — members are interchangeable by construction, so per-member sizing would have no meaning: the scheduler can hand any lease to any member. Absent means the chart default applies. A string rather than a number because Kubernetes quantities are a notation ("200m", "1", "1.5"), and re-deriving that notation from a number is how sizing bugs get introduced.'
- id: PoolMemberMemoryLimit
  valueType: String
  description: "Kubernetes memory limit of each pool member, e.g. \"1Gi\" (AB#4924). See PoolMemberMemoryRequest. Size it against the LARGEST tenant that may borrow the pool, not the average: a member serves one tenant at a time but serves each of them in full. AB#5330, measured: a member idles around 124 MiB and gains ~2 MiB per leased run, but the FIRST ExecuteCSharp@1 run costs it ~330 MiB permanently (the Roslyn compiler platform, loaded once per process and never released). A pool whose borrowers may run C# therefore needs at least 1Gi; at 512Mi the member is OOM-killed on the next lease it accepts, and because members are shared it takes another tenant's work down with it."
- id: PoolMemberMemoryRequest
  valueType: String
  description: "Kubernetes memory request of each pool member, e.g. \"512Mi\" (AB#4924). This is the number the whole feature is measured against: the prod-1 baseline in concept §1 is 170-200 Mi of pure .NET runtime per process for tenants that execute NOTHING, and a pool exists to stop paying that per tenant. Together with the lease spans (LeaseGrantedAt..LeaseReleasedAt) it is also what prices a borrower's consumption in concept §4b, so it is read for attribution and not only for scheduling."
- id: PoolScaleUpPolicy
  valueType: Enum
  valueCkEnumId: System.Communication-4.19.0/PoolScaleUpPolicy-1
  defaultValues:
  - 0
  description: 'Which queue signal starts another member (AB#4924). Default QueueDepthOrWaitSeconds. Scaling is driven by the queue and never by CPU: a member waiting for a lease is I/O-bound, so its CPU utilisation carries no information about whether work is piling up behind it (concept §4a).'
- id: Port
  valueType: Int
  isRuntimeState: true
  description: The port number is the number of the port on which the external system is listening for incoming connections.
- id: PrimaryColor
  valueType: String
  isRuntimeState: true
  description: The primary color of the theme
- id: PrivateKey
  valueType: Secret
  ownership: Secret
  isRuntimeState: true
  description: The private key is a secret key that is used in asymmetric encryption to authenticate with the external system.
- id: PrivateKeyPassphrase
  valueType: Secret
  ownership: Secret
  isRuntimeState: true
  description: The private key passphrase is a secret that is used to protect the private key.
- id: ProducerPrice
  valueType: Double
  isRuntimeState: true
  description: Price per kWh for producers in the energy community
- id: QueuedAt
  valueType: DateTime
  isRuntimeState: true
  description: Timestamp when the work item entered the pool queue (AB#4924). Set together with ExecutionStatus=Queued on a Leased workload and never overwritten afterwards, so QueuedAt..LeaseGrantedAt is the queue wait. Unset on a dedicated adapter, which is created Running.
- id: ReceivesClusterSecrets
  valueType: Boolean
  defaultValues:
  - false
  description: When true, the Communication Operator injects cluster-internal credentials (MongoDB user/admin passwords, CrateDB password) into the workload's Helm release as secret-flagged value overrides. Applies to Adapters and Applications (e.g. backend services that talk to the core MongoDB / CrateDB). Defaults to false so untrusted or edge workloads do not receive cluster credentials by accident; enable only for workloads that run in the same cluster as the OctoMesh core services and need to talk to them directly. The RabbitMQ broker password is NOT controlled by this flag — it is injected unconditionally because every workload needs the controller-to-workload command bus.
- id: RegisteredAt
  valueType: DateTime
  isRuntimeState: true
  description: UTC timestamp of the successful verification (transition to Registered).
- id: RegistrationEventAction
  valueType: Enum
  valueCkEnumId: System.Communication-4.19.0/SignalRegistrationAction-1
  defaultValues:
  - 0
  isRuntimeState: true
  description: 'What was attempted and how it ended (SignalRegistrationAction: RegisterRequested, RegisterFailed, CodeVerified, VerifyFailed, Deleted, DeleteFailed).'
- id: RegistrationEventAt
  valueType: DateTime
  isRuntimeState: true
  description: UTC timestamp of the audited registration attempt (SignalRegistrationEvent record).
- id: RegistrationEventDetail
  valueType: String
  isRuntimeState: true
  description: Outcome detail of the audited attempt, e.g. the bridge message ("captcha required", "rate limited (retry after 30s)", "wrong code") or "registered" on a successful verification.
- id: RegistrationEventUser
  valueType: String
  isRuntimeState: true
  description: 'Acting user of the audited attempt, resolved from the authenticated principal: display name and/or subject id ("Name (subject)"), or "unknown" for a principal without either claim.'
- id: RegistrationHistory
  valueType: RecordArray
  valueCkRecordId: System.Communication-4.19.0/SignalRegistrationEvent-1
  isRuntimeState: true
  description: 'Capped audit trail of registration attempts (AB#5143): SignalRegistrationEvent records, newest first, the newest 50 kept. Appended server-side only; deleted together with the definition (a fresh definition starts with a fresh history).'
- id: RegistrationState
  valueType: Enum
  valueCkEnumId: System.Communication-4.19.0/SignalRegistrationState-1
  defaultValues:
  - 0
  isRuntimeState: true
  description: Current registration state of the number against the Signal bridge. Driven by the register/verify/delete self-service flow (AB#5143).
- id: RepositoryUrl
  valueType: String
  description: HTTP(S) URL of a Helm repository index, e.g. https://meshmakers.github.io/octo-helm-core (public) or a private GitHub Pages site.
- id: SapClient
  valueType: String
  isRuntimeState: true
  description: A client is a tenant instance in an SAP system. SAP is multi-tenant, which means that multiple organizations or departments can work on the same system without sharing data with each other.
- id: SapGatewayHost
  valueType: String
  isRuntimeState: true
  description: An SAP gateway host is a server that provides communication services between SAP systems or between SAP systems and external applications.
- id: SapGatewayService
  valueType: String
  isRuntimeState: true
  description: An SAP gateway service provides communication services that are used between SAP systems or between SAP systems and external applications.
- id: SapLanguage
  valueType: String
  description: The language key is a two-character code that identifies the language in which the user interface is displayed.
- id: SapProgramId
  valueType: String
  isRuntimeState: true
  description: A program ID is a unique identifier that is used to register a program on an SAP gateway server.
- id: SapRegistrationCount
  valueType: Int
  description: The registration count is the number of times a program is registered on an SAP gateway server.
- id: SapTrace
  valueType: String
  defaultValues:
  - 8
  description: The trace level is a number that determines the amount of information that is logged during communication with the SAP system.
- id: ScaleUpQueueDepthThreshold
  valueType: Int
  defaultValues:
  - 5
  description: Number of work items waiting for a lease that makes the pool start another member, when PoolScaleUpPolicy includes the depth signal (AB#4924). Measured across the whole pool queue, not per borrowing tenant — the pool scales because IT is saturated, whereas a single tenant's burst is bounded by round-robin and LendingMaxConcurrentLeasesPerTenant instead.
- id: ScaleUpQueueWaitSeconds
  valueType: Int
  defaultValues:
  - 60
  description: 'How long the OLDEST waiting work item may wait before the pool starts another member, when PoolScaleUpPolicy includes the wait signal (AB#4924). Catches the case depth alone misses: two items behind one long-running lease never reach a depth threshold but can still wait for minutes. Concept §8 Q14 leaves the averaging window over which this is evaluated to be MEASURED during implementation rather than guessed, which is why the threshold is configuration and not a constant.'
- id: SealedCaller
  valueType: String
  isRuntimeState: true
  description: 'Sealed (authenticated-encrypted) envelope of the invoker this queued work item was created for: principal, trust level and delegation token, bound to the tenant and to this execution (AB#7472). Written only by the controller at enqueue and re-sealed when the work item is re-queued; the controller drops it at lease grant when it does not verify. Never edit; an edited, copied or plain-text value is ignored. The token part is removed when the lease is granted.'
- id: SecondaryColor
  valueType: String
  isRuntimeState: true
  description: The secondary color of the theme
- id: SecretDefaultAllowedTenantIds
  valueType: StringArray
  ownership: TenantOwned
  isRuntimeState: true
  description: "Member of the SecretDefaultProjection record (AB#7243): optional allow-list that NARROWS the target tenants of one default. Absent or empty means the Application's own tenant plus its whole subtree. A listed tenant outside that subtree is ignored, never granted: the list is an intersection, never a way to widen the target set."
- id: SecretDefaultDescription
  valueType: String
  ownership: TenantOwned
  isRuntimeState: true
  description: 'Member of the SecretDefaultProjection record (AB#7243): optional free text saying what the default is for. Never holds the value itself.'
- id: SecretDefaultKey
  valueType: String
  ownership: TenantOwned
  isRuntimeState: true
  description: 'Member of the SecretDefaultProjection record (AB#7243): the record key and the well-known name of the SecretDefault the controller creates in every target tenant (e.g. ec-captcha-secret). Identifies the entry inside SecretDefaults; keep it unique per Application.'
- id: SecretDefaultLastProjectedAt
  valueType: DateTime
  ownership: RuntimeState
  isRuntimeState: true
  description: UTC timestamp of the last time the controller projected this SecretDefault (AB#7243). Set by the controller; never author-set.
- id: SecretDefaultSourceTenantId
  valueType: String
  ownership: RuntimeState
  isRuntimeState: true
  description: Tenant of the Application that declared this SecretDefault (AB#7243). Set by the controller; never author-set.
- id: SecretDefaultSourceWorkloadRtId
  valueType: String
  ownership: RuntimeState
  isRuntimeState: true
  description: Bare RtId of the Application that declared this SecretDefault (AB#7243). Set by the controller; never author-set.
- id: SecretDefaultValue
  valueType: Secret
  ownership: Secret
  isRuntimeState: true
  description: "The secret default value (AB#7243): member SecretValue of the SecretDefaultProjection record and attribute Value of the SecretDefault entity. Write the plaintext (never an encrypt-value ciphertext); the engine encrypts it. Reads only report whether it is set. \U0001F534 On the SecretDefault entity it is platform-only: no tenant pipeline, user or role may reveal it."
  securitySensitive: true
- id: SecretDefaults
  valueType: RecordArray
  valueCkRecordId: System.Communication-4.19.0/SecretDefaultProjection-1
  ownership: TenantOwned
  isRuntimeState: true
  description: "Secret defaults this Application declares for every tenant it serves (AB#7243). Optional, and only on Application. Each entry is projected by the controller into a platform-owned SecretDefault entity in the Application's own tenant and its whole subtree; the target set is never widened, only narrowed by AllowedTenantIds. \U0001F534 This is NOT a ValueOverride: it never reaches Helm values, the pod or the app's Kubernetes Secret. Keep at most one entry per Key."
- id: SecretValue
  valueType: Secret
  ownership: Secret
  isRuntimeState: true
  description: 'Secret value of a ValueOverride entry flagged IsSecret. Write the plaintext (never an encrypt-value ciphertext); the engine encrypts it. Reads only report whether it is set. Path identifies the entry: keep at most one entry with a SecretValue per Path.'
- id: SenderEmail
  valueType: String
  isRuntimeState: true
  description: Email address used as the sender (From) for outgoing emails.
- id: SignalDisplayName
  valueType: String
  description: Profile display name of the account, shown to Signal users instead of "Unknown". Pushed to the bridge (PUT /v1/profiles/{number}) when the channel reaches Registered (verify success or adoption) and on the displayName self-service endpoint (which also clears it — without a bridge call, since Signal profiles need a non-empty name); stored here so it survives re-registration. Author configuration, not runtime state.
- id: SourceAttributePath
  valueType: String
  description: Path to the source attribute to read (e.g., CurrentValue, or nested record.field). If not set, the adapter determines the default.
- id: SourceIdentifier
  valueType: String
  isRuntimeState: true
  description: Identifier of the source entity (e.g. Loxone Control UUID, MQTT device ID)
- id: StartedAt
  valueType: DateTime
  isRuntimeState: true
  description: Timestamp when execution started
- id: StatusMessage
  valueType: String
  isRuntimeState: true
  description: Human-readable status or error message from the last deployment or configuration attempt. Reflects the current/live status — overwritten on every state change including successful transitions. For persistent error history, use LastDeploymentError / LastConfigurationError.
- id: SuccessCount
  valueType: Int
  defaultValues:
  - 0
  isRuntimeState: true
  description: Successful executions folded into this bucket
- id: SystemId
  valueType: String
  isRuntimeState: true
  description: The System ID (SID) is the unique technical name of an SAP system. It consists of three letters and uniquely identifies a system within a landscape.
- id: SystemNumber
  valueType: String
  isRuntimeState: true
  description: The system number is a two-digit number assigned to an SAP system during installation. It is used to identify the SAP service (e.g. Dispatcher) on a specific port.
- id: Tag
  valueType: String
  description: The tag value used for categorization and filtering.
- id: TargetAttributePath
  valueType: String
  description: Path to the target attribute to update on the mapped entity (e.g., Temperature, Humidity, or nested record.field)
- id: TaxRate
  valueType: Double
  defaultValues:
  - 20.0
  isRuntimeState: true
  description: Tax rate applied to energy transactions in the community
- id: Temperature
  valueType: Double
  defaultValues:
  - 0.1
  description: Temperature for AI response generation (0.0 = deterministic, 1.0 = creative).
- id: TertiaryColor
  valueType: String
  isRuntimeState: true
  description: The tertiary color of the theme
- id: TotalDurationMs
  valueType: Int64
  defaultValues:
  - 0
  isRuntimeState: true
  description: Sum of execution durations folded into this bucket (ms)
- id: TriggerType
  valueType: Enum
  valueCkEnumId: System.Communication-4.19.0/PipelineTriggerType-1
  defaultValues:
  - 0
  isRuntimeState: true
  description: How this pipeline execution was initiated (Manual, Scheduled, Event, or Startup).
- id: UiThemeColors
  valueType: Record
  valueCkRecordId: System.Communication-4.19.0/UiThemeColors-1
  isRuntimeState: true
  description: Theme color configuration for an application
- id: Username
  valueType: String
  isRuntimeState: true
  description: The username is the name of the user that is used to authenticate with the external system.
- id: Value
  valueType: String
  isRuntimeState: true
  description: String value of a ValueOverride entry (plain text, readable and templatable). For entries flagged IsSecret the value belongs in SecretValue; a legacy enc:v1 Value on an IsSecret entry is still decrypted at deploy time but deprecated (AB#5537).
- id: Values
  valueType: RecordArray
  valueCkRecordId: System.Communication-4.19.0/ValueOverride-1
  isRuntimeState: true
  description: 'Structured Helm value overrides. Deep-merged on top of ValuesYaml during deploy. Entries flagged IsSecret keep their value in SecretValue (encrypted by the engine); at most one entry carrying a SecretValue per Path. Runtime-state (AB#4706): operator-managed overrides (e.g. publicUri, clientId) are preserved across blueprint re-apply; a blueprint that needs to ship NEW default overrides only seeds them on fresh installs.'
- id: ValuesYaml
  valueType: String
  isRuntimeState: true
  description: 'Full values.yaml content as a YAML string. Edited in a code editor or uploaded as a file in the Studio. Acts as the base layer of Helm values; ValueOverrides are deep-merged on top. Runtime-state (AB#4706): operator-managed, preserved across blueprint re-apply.'
records:
- recordId: AdapterPoolLeaseResult
  isFinal: true
  description: 'Result of AdapterPool.GrantLease: whether a lease was granted and on which member.'
  attributes:
