    targetCkTypeId: System.Communication-4.19.0/DeploymentSite-1
  description: Abstract base type for workloads that the Communication Operator deploys to Kubernetes via Helm. Carries the chart reference, base values.yaml, and structured value overrides shared by Adapter and Application.
  methods:
  - methodId: Wake-1
    description: 'Wakes a hibernated OnDemand workload: scales it to one replica and waits until it is registered and configured (budget LifecycleWakeBudgetSeconds, default 60 s). No-op for AlwaysOn workloads, for tenants without scale-to-zero and for running workloads (REST POST Adapter/{workloadRtId}/wake).'
    errors:
    - code: WORKLOAD_WAKE_FAILED
      description: The workload did not reach the Configured state in the budget, or the operator could not scale it up. The wake may still complete in the cluster; retry shortly.
    authorization:
      roles:
      - CommunicationManagement
    execution:
      timeoutSeconds: 90
      idempotent: true
  - methodId: SetChartVersion-1
    description: 'Sets the Helm chart version of the workload (REST PATCH Workload/{workloadRtId}/chart-version). Empty or absent means: the newest chart of the configured repository. Does not deploy; deploy the workload afterwards.'
    parameters:
    - name: chartVersion
      valueType: String
      isOptional: true
      description: A SemVer (1.2.3, 1.2.3-beta.1); empty or absent = the newest chart in the configured repository.
    errors:
    - code: WORKLOAD_CHART_VERSION_UPDATE_FAILED
      description: The workload exists but the new chart version could not be stored.
    authorization:
      roles:
      - CommunicationManagement
    execution:
      timeoutSeconds: 15
      idempotent: true
  - methodId: Deploy-1
    description: 'Deploys the workload (REST POST DeploymentSite/workloads/deploy?workloadRtId=): provisions the pipeline service account of an adapter, asks the operator of its deployment site to install or upgrade the Helm release and sets the workload Pending. The result carries a warning when an explicit Helm value overrode a typed CPU/memory setting.'
    result:
      valueType: Record
      valueCkRecordId: System.Communication-4.19.0/WorkloadDeployResult-1
    errors:
    - code: COMMUNICATION_DISABLED
      description: Communication is disabled for the tenant; enable it first (REST 409). Nothing was changed.
    - code: WORKLOAD_DEPLOY_FAILED
      description: The workload could not be deployed, e.g. it is hosted by no deployment site or a Helm field is missing. Parameter message names the cause.
    authorization:
      roles:
      - CommunicationManagement
    execution:
      timeoutSeconds: 90
      idempotent: true
  - methodId: Undeploy-1
    description: 'Undeploys the workload (REST POST DeploymentSite/workloads/undeploy?workloadRtId=): asks the operator of its deployment site to uninstall the Helm release. Allowed while Communication is disabled, so remediation always works.'
    errors:
    - code: WORKLOAD_UNDEPLOY_FAILED
      description: The workload could not be undeployed, e.g. it is hosted by no deployment site or is not deployed. Parameter message names the cause.
    authorization:
      roles:
      - CommunicationManagement
    execution:
      timeoutSeconds: 60
