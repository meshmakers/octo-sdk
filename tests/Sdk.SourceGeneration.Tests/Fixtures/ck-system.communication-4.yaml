enums:
- enumId: AdapterSharingMode
  values:
  - key: 0
    name: NotShared
  - key: 1
    name: Descendants
  - key: 2
    name: DescendantsAndSiblings
  description: Whether and to whom an adapter lends its process as a leasable pool member (AB#4924). NotShared (default) keeps the adapter private to its own tenant — the behaviour of every adapter in the estate today. Descendants lends to any descendant of the owning tenant, direct or indirect, resolved by the same breadth-first tenant walk as GET {tenantId}/v1/tenants/descendants (AB#5151). DescendantsAndSiblings additionally lends to tenants that share the owning tenant's parent. In every mode the optional LendingAllowedTenantIds allow-list narrows the resolved set further; it never widens it, so a tenant outside the subtree can not be granted a lease by listing it.
- enumId: CommunicationState
  values:
  - key: 0
    name: Unregistered
  - key: 1
    name: Online
  - key: 2
    name: Offline
  description: Indicates the current SignalR connection state of an adapter or pool operator.
- enumId: ConfigurationState
  values:
  - key: 0
    name: Unconfigured
  - key: 1
    name: Pending
  - key: 2
    name: Configured
  - key: 3
    name: Error
  description: Indicates whether a deployable entity has been successfully configured with its pipeline definitions and settings.
- enumId: DeploymentState
  values:
  - key: 0
    name: Undeployed
  - key: 1
    name: Pending
  - key: 2
    name: Deployed
  - key: 3
    name: Error
  - key: 4
    name: Disabled
  description: 'Tracks whether a deployable entity (adapter, application, pipeline, pool, or trigger) is currently deployed and active. Disabled means the entity cannot be deployed at all: Edge pools (no central operator CR), workloads missing Helm chart/version/repository, or pipelines/triggers whose adapter is Disabled. Deploy/Undeploy actions are rejected on Disabled entities.'
- enumId: Environment
  values:
  - key: 0
    name: Edge
  - key: 1
    name: Cloud
  description: Where a pool's adapter workloads are hosted. Cloud pools are auto-deployed by the central Communication Operator into the OctoMesh cluster; Edge pools must be installed and run by an external operator outside the central cluster.
- enumId: HelmChannel
  values:
  - key: 0
    name: Dev
  - key: 1
    name: Release
  description: Distribution channel of a Helm chart repository. Used as a label so the UI can colour-code dev vs release sources; the operator does not derive behavior from this value.
- enumId: HelmRepositoryPurpose
  values:
  - key: 0
    name: Adapters
  - key: 1
    name: Applications
  description: Which kind of chart a Helm repository serves. Adapters covers adapter and platform charts, Applications covers tenant-app charts. Used by the Communication Controller to pick a repository for a workload that carries no explicit HelmRepository association; never a label only.
- enumId: LifecycleMode
  values:
  - key: 0
    name: AlwaysOn
  - key: 1
    name: OnDemand
  - key: 2
    name: Auto
  - key: 3
    name: Leased
  description: "Author-configured lifecycle policy of a deployable workload. AlwaysOn (default) keeps the workload running permanently. OnDemand lets the controller scale it to 0 replicas when idle and wake it on demand (AB#4914); only valid for workloads whose deployed pipelines use exclusively wake-capable triggers. Auto is reserved for a future controller-decided mode and is rejected by validation until implemented. Leased (AB#4924) means the workload has no process of its own at all: its pipelines execute on an AdapterPool lent by an ancestor or sibling tenant, one lease per work item — see the LentFrom association to a LentAdapterPool mirror (AB#5271) and docs/concepts/shared-adapter-leasing.md. Leased is the BORROWER's mode and only ever that; an AdapterPool is its own workload type with a replica range and is not itself Leased."
- enumId: LifecycleState
  values:
  - key: 0
    name: Running
  - key: 1
    name: Draining
  - key: 2
    name: Hibernated
  - key: 3
    name: Waking
  description: 'Runtime lifecycle state of an OnDemand workload (AB#4914). Running: normal operation. Draining: idle timeout reached, scale-to-0 requested. Hibernated: scaled to 0 replicas on purpose — CommunicationState=Offline is expected and must not raise alarms. Waking: a demand signal triggered scale-to-1; consumers wait for ConfigurationState=Configured. AlwaysOn workloads stay Running permanently.'
- enumId: PipelineExecutionClass
  values:
  - key: 0
    name: Interactive
  - key: 1
    name: Batch
  description: "Scheduling class of a pipeline on a leased adapter pool (AB#4924), resolved from the pipeline's trigger node when the pipeline is SAVED and persisted here — not parsed from the YAML at dequeue time, so the scheduler reads a field and the Studio / octo-cli / MCP surfaces can show WHY a job sits where it does. Interactive is work a human is waiting for (HTTP request, manual run, Studio \"execute now\"). Batch is everything scheduled or event-driven. Within one tenant's turn in the round-robin rotation, Interactive is served before Batch; across tenants the class has no effect whatsoever. Mirrors OnDemandCapable: computed, persisted for display, and re-resolved whenever the pipeline is saved — so a pipeline edited to a different trigger changes class visibly, as a change, rather than as behaviour that quietly shifts."
- enumId: PipelineExecutionFailureKind
  values:
  - key: 0
    name: Failed
  - key: 1
    name: OutcomeUnknown
  description: What a failed pipeline execution says about its writes (AB#8037). Failed is an ordinary failure (the database refused the write, or the pipeline failed for another reason). OutcomeUnknown means a write was neither acknowledged nor refused (MongoDB write-concern error, UnknownTransactionCommitResult) and may have taken effect; a pipeline method then answers METHOD_OUTCOME_UNKNOWN with a correlation id instead of METHOD_HANDLER_FAILED. Unset on a successful execution and on executions reported by an adapter that predates the field (treated as Failed).
- enumId: PipelineExecutionStatus
  values:
  - key: 0
    name: Running
  - key: 1
    name: Completed
  - key: 2
    name: Failed
  - key: 3
    name: Interrupted
  - key: 4
    name: Cancelled
  - key: 5
    name: Queued
  description: 'Status of a pipeline execution lifecycle, from queued or running through completion or failure. Queued (AB#4924) precedes Running on a Leased workload: the execution entity exists from the moment the work item is enqueued, so one execution stays one entity from enqueue to completion and the Studio renders a continuous history instead of joining a queue and an execution source.'
- enumId: PipelineTriggerType
  values:
  - key: 0
    name: Manual
  - key: 1
    name: Scheduled
  - key: 2
    name: Event
  - key: 3
    name: Startup
  description: Indicates how a pipeline execution was initiated.
- enumId: PoolScaleUpPolicy
  values:
  - key: 0
    name: QueueDepthOrWaitSeconds
  - key: 1
    name: QueueDepth
  - key: 2
    name: QueueWaitSeconds
  description: 'Which queue signal makes an adapter pool start another member (AB#4924). QueueDepth scales when the number of work items waiting for a lease crosses ScaleUpQueueDepthThreshold. QueueWaitSeconds scales when the oldest waiting item has waited longer than ScaleUpQueueWaitSeconds. QueueDepthOrWaitSeconds (default) scales on whichever fires first, which is the behaviour a pool wants in practice: depth catches a burst, wait time catches a slow trickle behind one long-running lease. CPU-based scaling is deliberately absent — a member waiting for a lease is idle by construction.'
- enumId: SignalRegistrationAction
  values:
  - key: 0
    name: RegisterRequested
  - key: 1
    name: RegisterFailed
  - key: 2
    name: CodeVerified
  - key: 3
    name: VerifyFailed
  - key: 4
    name: Deleted
  - key: 5
    name: DeleteFailed
  - key: 6
    name: Adopted
  - key: 7
    name: ProfileUpdated
  description: "Audited action of a Signal channel registration attempt (AB#5143). Every register/verify/delete attempt against the tenant's SignalChannel — including failed ones — appends one entry with this action to the channel's RegistrationHistory. Adopted means the bridge already held a working account for the number, so register/verify were skipped and the definition went straight to Registered. ProfileUpdated records a display-name profile push (PUT /v1/profiles/{number}) — its detail carries the pushed name, the failure text for a rejected push on the displayName endpoint, or the cleared note (clearing never touches the bridge profile). Deleted is part of the audit vocabulary but a persisted Deleted entry never survives: a successful DELETE erases the definition including its history (fresh definition = fresh history); the system event trail still records the deletion."
- enumId: SignalRegistrationState
  values:
  - key: 0
    name: Unregistered
  - key: 1
    name: CodePending
  - key: 2
    name: Registered
  - key: 3
    name: Failed
  description: Registration state of a tenant's Signal phone number against the Signal bridge (AB#5143). Unregistered means a definition exists but no registration was started (or a rate-limited attempt is pending retry). CodePending means the bridge accepted the register call and Signal sent an SMS verification code. Registered means the verify call succeeded and the number can send/receive. Failed means the last register attempt was rejected by the bridge (see LastError); a new register attempt is allowed.
modelId: System.Communication-4.19.0
description: Construction kit model for the OctoMesh Communication Controller. Defines adapters, adapter pools, deployment sites, pipelines, triggers, configurations, and execution tracking for data ingress and egress.
ckLanguage: 2
