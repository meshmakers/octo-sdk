types:
- typeId: Adapter
  derivedFromCkTypeId: System.Communication-4.19.0/DeployableWorkload-1
  associations:
  - id: System.Communication-4.19.0/LentFrom-1
    targetCkTypeId: System.Communication-4.19.0/LentAdapterPool-1
  - id: System.Communication-4.19.0/PipelineServiceAccount-1
    targetCkTypeId: System.Communication-4.19.0/ServiceAccountConfiguration-1
  description: An external client that connects via SignalR to execute data pipelines. Adapters are assigned to a deployment site and receive pipeline configurations from the Communication Controller. Deployed to Kubernetes by the Communication Operator via Helm (chart/values inherited from DeployableWorkload). An adapter with LifecycleMode = Leased has no process of its own and borrows one per work item from an AdapterPool in another tenant (AB#4924).
  methods:
  - methodId: DeployUpdate-1
    description: Pushes the current pipeline configuration to the running adapter (REST POST Adapter/deployUpdate). Wakes a hibernated OnDemand adapter first. Fails when the adapter has no live connection.
    errors:
    - code: ADAPTER_CONFIGURATION_DEPLOY_FAILED
      description: The configuration could not be pushed, e.g. the adapter is not deployed or not connected. Parameter reason names the cause.
    authorization:
      roles:
      - CommunicationManagement
    execution:
      timeoutSeconds: 90
      idempotent: true
  - methodId: ReconcileServiceAccount-1
    description: Reconciles the pipeline service account of the adapter against its declaration (REST POST Adapter/{adapterRtId}/serviceAccount/reconcile). The declared roles are materialised only when the caller holds UserManagement. Never rotates an existing secret.
    result:
      valueType: Record
      valueCkRecordId: System.Communication-4.19.0/ServiceAccountReconcileResult-1
    errors:
    - code: SERVICE_ACCOUNT_RECONCILE_FAILED
      description: The reconcile did not complete (identity bus or tenant repository failed).
    authorization:
      roles:
      - CommunicationManagement
    execution:
      timeoutSeconds: 60
      idempotent: true
  - methodId: RotateServiceAccountSecret-1
    description: Rotates the client secret of the pipeline service account of the adapter (REST POST Adapter/{adapterRtId}/serviceAccount/rotateSecret). The new secret is written into the ServiceAccountConfiguration only and is never part of the result; it takes effect when the pipelines of the adapter are redeployed.
    result:
      valueType: Record
      valueCkRecordId: System.Communication-4.19.0/ServiceAccountSecretRotationResult-1
    errors:
    - code: SERVICE_ACCOUNT_ROTATION_FAILED
      description: The rotation did not happen; the old secret stays valid.
    authorization:
      roles:
      - CommunicationManagement
    execution:
      timeoutSeconds: 60
  derivable: Any
  attributes:
  - id: System.Communication-4.19.0/CommunicationStateTimestamp-1
    name: CommunicationStateTimestamp
    isOptional: true
  - id: System.Communication-4.19.0/CommunicationState-1
    name: CommunicationState
  - id: System.Communication-4.19.0/ConfigurationState-1
    name: ConfigurationState
  - id: System.Communication-4.19.0/LastConfigurationError-1
    name: LastConfigurationError
    isOptional: true
  - id: System.Communication-4.19.0/LastConfigurationErrorTimestamp-1
    name: LastConfigurationErrorTimestamp
    isOptional: true
  - id: System.Communication-4.19.0/AdapterConfiguration-1
    name: Configuration
    isOptional: true
  - id: System.Communication-4.19.0/LastSyncedSequenceNumber-1
    name: LastSyncedSequenceNumber
- typeId: AdapterPool
  derivedFromCkTypeId: System.Communication-4.19.0/DeployableWorkload-1
  isFinal: true
  associations:
  - id: System.Communication-4.19.0/PoolServiceAccount-1
    targetCkTypeId: System.Communication-4.19.0/ServiceAccountConfiguration-1
  description: 'A pool of interchangeable adapter processes owned by one tenant and leased to tenants in its subtree, one work item per lease (AB#4924). The pool declares how many members may exist (MinReplicas..MaxReplicas), how big each member is, what queue pressure starts another one, and which tenants may borrow. Members are replicas of this one workload rather than separate entities: a lease binds a member to a tenant for the duration of one work item and the member retains nothing tenant-scoped afterwards. Not to be confused with DeploymentSite, which is where a workload is deployed and which was itself called Pool before 4.0.0.'
  methods:
  - methodId: RefreshMirrors-1
    kind: Static
    description: Reconciles the LentAdapterPool mirrors of the calling tenant (the borrower) against what its ancestors and siblings lend it (REST POST AdapterPool/mirrors/refresh).
    result:
      valueType: Record
      valueCkRecordId: System.Communication-4.19.0/AdapterPoolMirrorSyncResult-1
    authorization:
      roles:
      - CommunicationManagement
    execution:
      timeoutSeconds: 120
      idempotent: true
  - methodId: PublishMirrors-1
    kind: Static
    description: Pushes the adapter pools of the calling tenant (the lender) out to every tenant that may borrow from them (REST POST AdapterPool/mirrors/publish).
    result:
      valueType: Record
      valueCkRecordId: System.Communication-4.19.0/AdapterPoolMirrorSyncResult-1
    authorization:
      roles:
      - CommunicationManagement
    execution:
      timeoutSeconds: 120
      idempotent: true
  - methodId: GrantLease-1
    description: Grants a lease on a member of this pool to a borrowing tenant (REST POST AdapterPool/{adapterPoolRtId}/lease; a test and diagnostic surface, production leasing is the scheduler's). A refused lease is a normal result with granted false and a status message.
    parameters:
    - name: borrowerTenantId
      valueType: String
      description: The borrowing tenant; it must be in the lending scope of the pool.
    - name: adapterRtId
      valueType: String
      description: RtId (24 hexadecimal characters) of the Leased adapter in the borrowing tenant.
    - name: executionId
      valueType: String
      isOptional: true
      description: The queued execution the lease is for.
    - name: ttlSeconds
      valueType: Int
      isOptional: true
      description: Lease lifetime in seconds (1-3600); without it the default applies.
    result:
      valueType: Record
      valueCkRecordId: System.Communication-4.19.0/AdapterPoolLeaseResult-1
    authorization:
      roles:
      - CommunicationManagement
    execution:
      timeoutSeconds: 30
  - methodId: CancelQueuedExecution-1
    description: Cancels one execution that is still waiting in the queue of this pool for a lease (REST DELETE AdapterPool/{adapterPoolRtId}/queue/{executionId}). It never interrupts a running pipeline.
    parameters:
    - name: executionId
      valueType: String
