- typeId: Pipeline
  derivedFromCkTypeId: System.Communication-4.19.0/DeployableEntity-1
  associations:
  - id: System@2/ParentChild-1
    targetCkTypeId: System.Communication-4.19.0/DataFlow-1
  - id: System.Communication-4.19.0/Executes-1
    targetCkTypeId: System.Communication-4.19.0/Adapter-1
  - id: System.Communication-4.19.0/Uses-1
    targetCkTypeId: System@2/Configuration-1
  - id: System.Communication-4.19.0/SendsDataTo-1
    targetCkTypeId: System.Communication-4.19.0/Pipeline-1
  description: A data processing pipeline that defines a sequence of processing nodes. Pipelines are deployed to adapters for execution and can be organized within data flows.
  methods:
  - methodId: Deploy-1
    description: Validates, persists and deploys the pipeline to its adapter (REST POST Pipeline/deploy). Wakes a hibernated OnDemand adapter first; a Leased adapter receives the definition with its next lease.
    parameters:
    - name: adapterRtId
      valueType: String
      isOptional: true
      description: 'RtId (24 hexadecimal characters) of the adapter to deploy to. Default: the adapter the pipeline is assigned to.'
    - name: pipelineDefinition
      valueType: String
      isOptional: true
      sensitive: true
      description: 'A pipeline definition (YAML) that replaces the stored one before the deploy. Default: the stored definition. Sensitive: a definition can carry credentials, so it is never logged, audited or traced.'
    errors:
    - code: PIPELINE_ADAPTER_NOT_ASSIGNED
      description: No adapterRtId was given and the pipeline is not assigned to an adapter.
    - code: PIPELINE_DEPLOY_REJECTED
      description: The adapter rejected the pipeline definition (REST 422). Parameter message names the cause.
    - code: PIPELINE_DEPLOY_FAILED
      description: The deploy did not happen, e.g. the adapter is not deployed or not connected (REST 404/400). Parameter message names the cause.
    authorization:
      roles:
      - CommunicationManagement
    execution:
      timeoutSeconds: 200
      idempotent: true
  - methodId: Execute-1
    description: Starts one execution of the pipeline on its adapter and returns its id without waiting for the end (REST POST Pipeline/execute). The caller is passed to a FromExecutePipelineCommand pipeline as with REST.
    parameters:
    - name: input
      valueType: String
      isOptional: true
      sensitive: true
      description: 'Input of the execution (the REST request body). Sensitive: input data is never logged, audited or traced. For an execution on a Leased adapter (not a dry run) the input is stored in the PipelineExecution entity of the tenant and stays there after the run (a retry copies it into the new execution), exactly as with REST.'
    - name: isDryRun
      valueType: Boolean
      isOptional: true
      description: True runs the pipeline with every dry-run-honouring Load node suppressing its side effect. Default false.
    result:
      valueType: Record
      valueCkRecordId: System.Communication-4.19.0/PipelineExecutionStartResult-1
    errors:
    - code: PIPELINE_EXECUTION_START_FAILED
      description: The execution could not be started, e.g. the adapter is offline. Parameter message names the cause.
    authorization:
      roles:
      - CommunicationManagement
    execution:
      timeoutSeconds: 30
  - methodId: SetDebugging-1
    description: Switches debug capture of the pipeline on or off, persists it and re-pushes the data flow when the adapter is online (REST PATCH Pipeline/{pipelineRtId}/debug). An offline adapter receives the change with its next deploy.
    parameters:
    - name: enabled
      valueType: Boolean
      description: The desired debug state.
    result:
      valueType: Record
      valueCkRecordId: System.Communication-4.19.0/PipelineDebugResult-1
    errors:
    - code: PIPELINE_DEBUG_CHANGE_FAILED
      description: The debug state could not be changed, e.g. the pipeline belongs to no data flow or the adapter rejected the configuration. Parameter message names the cause.
    authorization:
      roles:
      - CommunicationManagement
    execution:
      timeoutSeconds: 300
      idempotent: true
  - methodId: MoveToAdapter-1
    description: Assigns the pipeline to another adapter and optionally redeploys it there (REST PATCH Pipeline/move-to-adapter, one pipeline per call). A failed redeploy does not roll the move back; the result carries a warning. Unlike REST, redeploy also runs when the pipeline already points at the target adapter, so a retried call still deploys.
    parameters:
    - name: targetAdapterRtId
      valueType: String
      description: RtId (24 hexadecimal characters) of the new adapter.
    - name: redeploy
      valueType: Boolean
      isOptional: true
      description: True redeploys the pipeline on the new adapter after the move. Default false.
    result:
      valueType: Record
      valueCkRecordId: System.Communication-4.19.0/PipelineMoveResult-1
    errors:
    - code: PIPELINE_MOVE_FAILED
      description: The pipeline could not be moved, e.g. the target adapter does not exist. Parameter message names the cause.
    authorization:
      roles:
      - CommunicationManagement
    execution:
      timeoutSeconds: 200
      idempotent: true
  derivable: Any
  attributes:
  - id: System@2/Enabled-1
    name: Enabled
    isOptional: true
    ownership: TenantOwned
  - id: System.Communication-4.19.0/PipelineDefinition-1
    name: PipelineDefinition
  - id: System.Communication-4.19.0/IsDebuggingEnabled-1
    name: IsDebuggingEnabled
    isOptional: true
