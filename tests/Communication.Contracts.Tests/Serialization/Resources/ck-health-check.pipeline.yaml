# Fixture: the pipeline definition shipped in the Monitoring.CkHealth blueprint
# (octo-construction-kit/src/Blueprints/Monitoring.CkHealth/seed-data/data-flows/ck-health-check.yaml,
# embedded there as the System.Communication/PipelineDefinition-1 attribute).
# Copied verbatim so validate_pipeline_definition is exercised against a real multi-node
# blueprint pipeline rather than a synthetic snippet (AB#5240).
triggers:
  - type: FromPipelineTriggerEvent@1
  - type: FromExecutePipelineCommand@1
transformations:
  - type: GetRtEntitiesByType@1
    description: Load monitor configuration
    ckTypeId: Monitoring/CkHealthMonitorConfig
    targetPath: $.cfg
  - type: WriteJson@1
    description: Token request body (client_credentials)
    jsonString: '{"grant_type":"client_credentials"}'
    targetPath: $.tokenRequest
  - type: SetPrimitiveValue@1
    valuePath: $.cfg.Items[0].Attributes.ClientId
    valueType: String
    targetPath: $.tokenRequest.client_id
  - type: SetPrimitiveValue@1
    valuePath: $.cfg.Items[0].Attributes.ClientSecret
    valueType: String
    targetPath: $.tokenRequest.client_secret
  - type: SetPrimitiveValue@1
    valuePath: $.cfg.Items[0].Attributes.Scope
    valueType: String
    targetPath: $.tokenRequest.scope
  - type: MakeHttpRequest@1
    description: Acquire access token
    method: POST
    urlPath: $.cfg.Items[0].Attributes.TokenUrl
    bodyPath: $.tokenRequest
    bodyContentType: application/x-www-form-urlencoded
    onHttpError: Throw
    retry:
      maxAttempts: 3
    targetPath: $.token
  - type: FormatString@1
    description: Build Authorization header value
    format: "Bearer {$.token.access_token}"
    targetPath: $.authHeader
  - type: GetRtEntitiesByType@1
    description: Load monitored tenants
    ckTypeId: Monitoring/MonitoredTenant
    targetPath: $.tenants
  - type: ForEach@1
    description: Check every monitored tenant
    path: $
    iterationPath: $.tenants.Items
    targetPath: $.checkedTenants
    errorsPath: $.tenantErrors
    continueOnError: true
    maxDegreeOfParallelism: 1
    transformations:
      - type: FormatString@1
        description: Build LibraryStatus URL
        format: "{$.full.cfg.Items[0].Attributes.AssetServicesBaseUrl}/{$.key.Attributes.TenantId}/v1/Models/LibraryStatus"
        targetPath: $.key.statusUrl
      - type: MakeHttpRequest@1
        description: Query CK model library status
        method: GET
        urlPath: $.key.statusUrl
        headerParameters:
          - name: Authorization
            valuePath: $.full.authHeader
        onHttpError: Throw
        retry:
          maxAttempts: 3
        targetPath: $.key.status
      - type: ForEach@1
        description: Evaluate every model of the tenant
        path: $
        iterationPath: $.key.status.items
        targetPath: $.key.evaluated
        maxDegreeOfParallelism: 1
        transformations:
          - type: If@1
            description: Only installed models are relevant
            path: $.key.installedVersion
            operator: NotEquals
            valueType: String
            transformations:
              - type: If@1
                description: Alert on ResolveFailed
                path: $.key.modelState
                operator: Equals
                value: ResolveFailed
                valueType: String
                transformations:
                  - type: FormatString@1
                    format: "🔴 Tenant '{$.full.key.Attributes.TenantId}': CK model '{$.key.name}' ({$.key.installedVersion}) is in state RESOLVE FAILED - its types are not loaded and dependent pipelines will fail. Run octo-cli LibraryStatus/FixAll against this tenant."
                    targetPath: $.key.alertResolveFailed
                  - type: ReplyToTeamsChannel@1
                    webhookUrlPath: $.full.full.cfg.Items[0].Attributes.TeamsWebhookUrl
                    messageBodyPath: $.key.alertResolveFailed
                    title: OctoMesh CK Health Alert
                    themeColor: "CC0000"
                    continueOnError: false
              - type: If@1
                description: Alert on catalog inconsistency
                path: $.key.hasCatalogInconsistency
                operator: Equals
                value: true
                valueType: Boolean
                transformations:
                  - type: FormatString@1
                    format: "🟡 Tenant '{$.full.key.Attributes.TenantId}': CK model '{$.key.name}' ({$.key.installedVersion}) has a catalog inconsistency (a pinned dependency version is not published). The model cannot be (re)installed as-is."
                    targetPath: $.key.alertInconsistency
                  - type: ReplyToTeamsChannel@1
                    webhookUrlPath: $.full.full.cfg.Items[0].Attributes.TeamsWebhookUrl
                    messageBodyPath: $.key.alertInconsistency
                    title: OctoMesh CK Health Alert
                    themeColor: "E3A008"
                    continueOnError: false
  - type: ForEach@1
    description: Alert for tenants whose check failed (unreachable, auth error, ...)
    path: $
    iterationPath: $.tenantErrors
    targetPath: $.tenantErrorAlerts
    maxDegreeOfParallelism: 1
    transformations:
      - type: FormatString@1
        format: "🔴 CK health check could not verify a monitored tenant (LibraryStatus request failed): {$.key.errorType}: {$.key.message}"
        targetPath: $.key.alert
      - type: ReplyToTeamsChannel@1
        webhookUrlPath: $.full.cfg.Items[0].Attributes.TeamsWebhookUrl
        messageBodyPath: $.key.alert
        title: OctoMesh CK Health Alert
        themeColor: "CC0000"
        continueOnError: false
  - type: SetPipelineExecutionResult@1
    description: Persist the per-tenant errors as the execution output
    path: $.tenantErrors
